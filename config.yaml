# Configuración base del framework
dataset: spiral
model: mlp
seed: 42
data_dir: ./data
output_dir: ./outputs

# Entrenamiento base
training:
  epochs: 100
  batch_size: 32
  optimizer: adam
  lr: 0.001

# Estrategia de unlearning por defecto
unlearner: finetune
unlearning:
  epochs: 10
  lr: 0.0001
